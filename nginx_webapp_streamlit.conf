# BLOQUE 1: Redirección de HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name webapp.multibancaexpress.com;
    return 301 https://$host$request_uri;
}

# BLOQUE 2: Servidor HTTPS para Streamlit WebApp (Operadora CMS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webapp.multibancaexpress.com;

    ssl_certificate /etc/letsencrypt/live/webapp.multibancaexpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webapp.multibancaexpress.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Ruta para el Login (Control Maestro) -> Puerto 8503 (si aplica)
    location /login {
        proxy_pass http://127.0.0.1:8503/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /login;
        proxy_read_timeout 86400;
        proxy_redirect off;
    }

    # Ruta principal para Streamlit Operadora CMS -> Puerto 8501
    location / {
        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /;
        proxy_read_timeout 86400;
        proxy_redirect off;
    }
}
