name: Deploy Landing Page to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying Landing Page via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || secrets.SERVER_IP || '67.205.150.98' }}
          username: ${{ secrets.SSH_USERNAME || 'root' }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Sincronizando repositorio en el servidor..."
            [ -d /home/multibancaexpress-landingpage/.git ] || git clone https://github.com/andyfuenmayor-droid/multibancaexpress-landingpage.git /home/multibancaexpress-landingpage
            cd /home/multibancaexpress-landingpage
            git config --global --add safe.directory "*" || true
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Copiando archivos a la ruta web de producción..."
            mkdir -p /var/www/webapp.multibancaexpress.com
            cp -r /home/multibancaexpress-landingpage/* /var/www/webapp.multibancaexpress.com/
            chown -R www-data:www-data /var/www/webapp.multibancaexpress.com
            chmod -R 755 /var/www/webapp.multibancaexpress.com

            echo "⚙️ Verificando configuración Nginx..."
            if [ -f /var/www/webapp.multibancaexpress.com/nginx_webapp.conf ]; then
              cp /var/www/webapp.multibancaexpress.com/nginx_webapp.conf /etc/nginx/sites-available/webapp.multibancaexpress.com
              ln -sf /etc/nginx/sites-available/webapp.multibancaexpress.com /etc/nginx/sites-enabled/webapp.multibancaexpress.com
            fi

            nginx -t && systemctl reload nginx
            echo "✅ ¡Landing Page actualizada y en vivo en https://webapp.multibancaexpress.com!"\n